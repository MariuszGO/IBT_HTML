<!DOCTYPE html>       <!-- Struktura dokumentu HTML5 -->
<html lang="pl-PL">   <!--Początkowy znacznik dokumentu HTML, lang='pl-PL' określa
                        ktaj i język w jakim powostała strona-->
<head>                 <!-- Sekcja nagłówkowa w której umieszczamy np. sposób kodowania
                        znaków, tytuł strony, co zwiera strona, połączenia z CSS, skrypty JS-->
    <meta charset="UTF-8">   <!-- UTF-8 kodowanie polskich znaków-->
    <title>Nasza nowa pierwsza strona</title> <!--Tytuł strony-->
</head>                     <!--koniec sekcji nagłówkowej-->
<body>                      <!--początek ciała strony w którym zawarta jest cała stona internetowa-->
    <p>Witaj na stronie</p> <!--paragraf p w którym umieszczamy tekst-->
    <p>TEST: żąźćłó</p>

</body>                     <!--koniec ciała strony-->
</html>                     <!--koniec dokumentu HTML-->
