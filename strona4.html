<!DOCTYPE html>
<html lang='pl-PL'>
<head>
    <meta charset='utf-8'>
    <meta name='viewport' content='width=device-width, initial-scale=1'>
    <title>Formularze</title>
    <link rel='stylesheet' href='style.css'>
</head>
<body>

<!-- label służy do dodawania etykiety do pol formularza
     atrybut for informuje przegladarkę lub serwer z jakim polem jest 
     połączony for musi mieć taką samą wartość jak id w polu input 
     
     alternatywa bez for i id:
     <label>Nazwisko: <input type="text"> </label>

     a nie możemy zrobić tak: (BŁĄD!!!!!)
     <label>Nazwisko:</label>
     <input type="text">
         -->
<form>
    <label for="imie">Imie: </label>
    <input type="text" id="imie" maxlength="10" size="15" placeholder="Proszę podać imie"><br> 
    <label for="na">Nazwisko: </label>
    <input type="text" id="na"><br>
    <label for="wiek">Wiek: </label>
    <input type="number" id="wiek" min="1" max="110"><br> 
   <!-- <input type="submit" value="Wyślij"> -->
    <input type="reset" value="Wyczyść formularz"> 
    <button>Wyślij</button>
  <!--  <input type="button" value="Inny przycisk"> -->
</form>
    
</body>
</html>
