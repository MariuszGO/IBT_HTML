<!DOCTYPE html>
<html lang='pl-PL'>
<head>
    <meta charset='utf-8'>
    <meta name='viewport' content='width=device-width, initial-scale=1'>
    <title>Formularze</title>
    <link rel='stylesheet' href='style.css'>
</head>
<body>

<!-- label służy do dodawania etykiety do pol formularza
     atrybut for informuje przegladarkę lub serwer z jakim polem jest 
     połączony for musi mieć taką samą wartość jak id w polu input 
     
     alternatywa bez for i id:
     <label>Nazwisko: <input type="text"> </label>

     a nie możemy zrobić tak: (BŁĄD!!!!!)
     <label>Nazwisko:</label>
     <input type="text">
         -->
<form>
    <fieldset>    
     <legend>Podaj dane osobowe</legend>   
        <label for="imie">Imie: </label>
    <input type="text" id="imie" maxlength="10" size="15" placeholder="Proszę podać imie"><br> 
    <label for="na">Nazwisko: </label>
    <input type="text" id="na"><br>
    <label for="wiek">Wiek: </label>
    <input type="number" id="wiek" min="1" max="110"><br> 
   <!-- <input type="submit" value="Wyślij"> -->
    <label> Hasło: 
        <input type="password" > 
    </label><br>
    <label for="mail">E-mail: </label>
    <input type="email" id="mail"><br>
    <input type="reset" value="Wyczyść formularz"> 
    <button>Wyślij</button>
  <!--  <input type="button" value="Inny przycisk"> -->
    </fieldset>

</form>

<!--Nasz 2 formularz
W przypadku inputa radio atrybut name musi mieć taką samą nazwę, inczaczej będzie można
kiliknąć więcej niż 1 opcję radio co nie jest poprawne. Tekst po słowie value będzie wysyłąny
dalej.
-->

<form>
    <p>Twój ulubiony kolor: </p><br>
    
    <input type="radio" id="op1" name="kolory" value="czarny">
    <label for="op1">Czarny: </label><br>
  
    <input type="radio" id="op2" name="kolory" value="zielony">
    <label for="op2">Zielony: </label><br>

    <input type="radio" id="op3" name="kolory" value="czerwony" checked>
    <label for="op3">Czerwony: </label><br>
    
    <p> Wybierz sowoje ulubione marki pojazdów: </p>
    <label><input type="checkbox" value="Audi" name="audi">Audi</label><br>
    <label><input type="checkbox" value="BMW" name="bmw">BMW</label><br>
    <label><input type="checkbox" value="VW" name="vw">VW</label><br>
    <label><input type="checkbox" value="Opel" name="opel" checked>Opel</label><br>
    <label><input type="checkbox" value="Toyota" name="toyota" checked>Toyota</label><br>
    <label><input type="checkbox" value="Peugot" name="peugot">Peugot</label><br>
    <label><input type="checkbox" value="Kia" name="kia" disabled>Kia</label><br>
    <label><input type="checkbox" value="Porsche" name="porsche" hidden>Porsche</label>

    <p>Wybierz płeć:</p>
    <select id="plec" name="plec">
        <option value="opcja1">Męska</option>
        <option value="opcja2" selected>Żeńska</option>
    </select><br>

    <textarea cols="50" rows="10">

    </textarea>

  <input list="miasta" name="miasta">
  <datalist id="miasta">
    <option value="Gorlice">
    <option value="Jasło">
    <option value="Grybów">
    <option value="Nowy Sącz">
    <option value="Tarnów">
  </datalist>
  <input type="submit" value="Wybierz">
</form>





    <input type="submit" value="Wyślij">
</form>



    
</body>
</html>
